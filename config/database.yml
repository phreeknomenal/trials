# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
#
default: &default
  adapter: postgresql
  encoding: unicode
  # The pool must cover Puma's threads AND Solid Queue's own connections, since
  # SOLID_QUEUE_IN_PUMA runs the supervisor inside the web process. Deriving the
  # pool from RAILS_MAX_THREADS alone starves Solid Queue and it exits on boot,
  # taking Puma down with it. DB_POOL overrides if the two ever need decoupling.
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 7 } %>

development:
  <<: *default
  database: trials_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: trials_test

# Heroku provisions a single database and injects DATABASE_URL, which Rails
# merges over this entry. Solid Cache, Queue, and Cable share this connection
# rather than getting databases of their own -- see the migration task doc.
production:
  <<: *default
  database: trials_production
